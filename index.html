<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="assets/style.css">
</head>

<body class="body bg-black text-white min-h-screen flex items-center justify-center">

<div class="max-w-md mx-auto mt-16 bg-white p-6 rounded-xl shadow-lg">

    <h1 class="text-1xl text-black font-bold text-center mb-6">
        PAINEL ORGANIZADOR
    </h1>

    <div class="flex gap-2">
<input
    id="taskInput"
    type="text"
    placeholder="O que você precisa fazer?"
    class="flex-1 bg-white border rounded-lg px-3 py-2 text-black placeholder-gray-350 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button
            id="addBtn"
            class="bg-gray-600 hover:bg-blue-700 text-white px-4 rounded-lg">
            Inserir
        </button>

    </div>

    <ul
        id="taskList"
        class="mt-6 space-y-3">
    </ul>

</div>

<script src="assets/script.js"></script>

</body>
</html>
